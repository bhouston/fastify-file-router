name: Bug report
description: Report a reproducible problem
title: 'fix: '
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps, minimal example, package version, and Node version.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
