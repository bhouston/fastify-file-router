name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm tsc
      - run: pnpm lint
      - name: Check formatting
        run: pnpm exec oxfmt --check .
      - run: pnpm test:coverage
      # --- repository-specific steps (package-content check, size budget, e2e, docs, ...) go here ---
      - run: pnpm release:check
      - name: Check published JavaScript size
        run: pnpm size | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Inspect publishable package
        run: |
          pnpm release:prepare
          npm pack --dry-run ./packages/fastify-file-router
          npm pack --dry-run --json ./packages/fastify-file-router | grep -q '"dist/index.js"' || {
            echo "::error::dist/index.js missing from the packed tarball; the publish step would ship a broken package."
            exit 1
          }
      - name: Audit dependencies
        id: audit
        continue-on-error: true
        run: pnpm audit --audit-level=high
      - name: Flag audit findings
        if: steps.audit.outcome == 'failure'
        run: echo '::warning::Dependency audit found vulnerabilities or could not reach the registry. Review the audit step.'
      - uses: codecov/codecov-action@v5
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
