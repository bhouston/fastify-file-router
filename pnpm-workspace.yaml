packages:
  - packages/*
  - demos/*

allowBuilds:
  core-js: false
  esbuild: true

linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - '@vitest/*'
  - vitest

overrides:
  serialize-javascript: ^7.0.3
  source-map-js: ^1.2.2
  tinypool: ^2.1.2
  handlebars: ^4.7.10
  markdown-it: ^14.3.3
  zod: ^4.6.7
  body-parser: ^1.20.9
  'undici@>=7': ^7.30.1
  'undici@<7': ^6.29.1
  follow-redirects: ^1.16.2
  joi: ^17.13.9
